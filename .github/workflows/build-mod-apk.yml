name: Build Mod APK

on:
  workflow_dispatch:
    inputs:
      apk_release_tag:
        description: 'Release tag containing the original APK (for example apk-174)'
        required: true
        type: string
      apk_asset_name:
        description: 'Exact APK filename; leave blank when the release has exactly one APK'
        required: false
        type: string
      publish_release:
        description: 'Publish signed APK and Mod ZIP to a new GitHub Release'
        required: true
        default: true
        type: boolean
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: mod-apk-${{ github.event_name }}-${{ inputs.apk_release_tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'apk-')
    runs-on: windows-2022
    timeout-minutes: 60
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout Mod source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.repository.default_branch || github.ref }}
          persist-credentials: false

      - name: Check signing configuration
        env:
          KEY: ${{ secrets.APK_KEYSTORE_BASE64 }}
          ALIAS: ${{ secrets.APK_KEY_ALIAS }}
          STORE_PASS: ${{ secrets.APK_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.APK_KEY_PASSWORD }}
        run: |
          foreach ($name in @('KEY','ALIAS','STORE_PASS','KEY_PASS')) {
            if (![Environment]::GetEnvironmentVariable($name)) { throw "Missing signing secret: $name. See README.md." }
          }

      - name: Install .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            6.0.x

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download APK and pinned toolchain
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_TAG: ${{ inputs.apk_release_tag || github.event.release.tag_name }}
          SOURCE_ASSET: ${{ inputs.apk_asset_name }}
        run: |
          ./ci/Get-ReleaseAsset.ps1 -Repository $env:REPOSITORY -Tag $env:SOURCE_TAG -AssetName $env:SOURCE_ASSET -Output "$env:RUNNER_TEMP/input.apk"
          $config = Get-Content ./ci/toolchain.json -Raw | ConvertFrom-Json
          ./ci/Get-ReleaseAsset.ps1 -Repository $env:REPOSITORY -Tag $config.releaseTag -AssetName $config.assetName -Output "$env:RUNNER_TEMP/toolchain.zip" -Sha256 $config.sha256
          [IO.Compression.ZipFile]::ExtractToDirectory("$env:RUNNER_TEMP/toolchain.zip", "$env:RUNNER_TEMP/toolchain")

      - name: Checkout current translations
        uses: actions/checkout@v4
        with:
          repository: Berumic/MonsterMusumeTDChineseTranslation
          ref: main
          path: work/translations
          persist-credentials: false

      - name: Build, test, align, sign and verify
        env:
          APK_KEYSTORE_BASE64: ${{ secrets.APK_KEYSTORE_BASE64 }}
          APK_KEY_ALIAS: ${{ secrets.APK_KEY_ALIAS }}
          APK_STORE_PASSWORD: ${{ secrets.APK_STORE_PASSWORD }}
          APK_KEY_PASSWORD: ${{ secrets.APK_KEY_PASSWORD }}
        run: |
          $keystore = "$env:RUNNER_TEMP/mod-signing.p12"
          try {
            [IO.File]::WriteAllBytes($keystore, [Convert]::FromBase64String($env:APK_KEYSTORE_BASE64))
            Remove-Item Env:APK_KEYSTORE_BASE64
            ./ci/Build-Apk.ps1 -Apk "$env:RUNNER_TEMP/input.apk" -Toolchain "$env:RUNNER_TEMP/toolchain" -TranslationsRoot "$env:GITHUB_WORKSPACE/work/translations" -Keystore $keystore -KeyAlias $env:APK_KEY_ALIAS -Java "$env:JAVA_HOME/bin/java.exe" -Workspace "$env:RUNNER_TEMP/mod-build" -Output "$env:GITHUB_WORKSPACE/dist"
          } finally {
            if (Test-Path -LiteralPath $keystore) { Remove-Item -LiteralPath $keystore -Force }
            Remove-Item Env:APK_STORE_PASSWORD,Env:APK_KEY_PASSWORD -ErrorAction SilentlyContinue
          }

      - name: Upload verified outputs
        uses: actions/upload-artifact@v4
        with:
          name: signed-mod-apk-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish Mod Release
        if: github.event_name == 'release' || inputs.publish_release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          $info = Get-Content ./dist/build-info.json -Raw | ConvertFrom-Json
          $tag = "mod-$($info.versionCode)-$($info.modVersion)-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $title = "MonsterMusumeTD $($info.versionName) / Mod $($info.modVersion)"
          $notes = @(
            "Game versionCode: $($info.versionCode)",
            "Mod commit: $($info.sourceCommit)",
            "Translations commit: $($info.translationCommit)",
            "Signed ARM64 APK, Mod files ZIP, build metadata and SHA256 checksums.",
            "Built by GitHub Actions run $env:GITHUB_RUN_ID."
          ) -join "`n`n"
          $notesFile = "$env:RUNNER_TEMP/release-notes.md"
          [IO.File]::WriteAllText($notesFile, $notes)
          $files = @(Get-ChildItem ./dist -File | ForEach-Object FullName)
          & gh release create $tag @files --repo $env:REPOSITORY --target $info.sourceCommit --title $title --notes-file $notesFile --draft --latest=false
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed; verified files are available in Actions artifacts. A draft may remain.' }
          & gh release edit $tag --repo $env:REPOSITORY --draft=false --latest=false
          if ($LASTEXITCODE -ne 0) { throw 'Release remains a draft; check its assets before publishing.' }

      - name: Remove signing material
        if: always()
        run: |
          $keystore = "$env:RUNNER_TEMP/mod-signing.p12"
          if (Test-Path -LiteralPath $keystore) { Remove-Item -LiteralPath $keystore -Force }

